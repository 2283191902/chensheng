<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="陈生 · AI 智能对话助手——话不多，事都办。">
<title>陈生 · 智能对话助手</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%238f7ff0'/%3E%3Ctext x='32' y='44' font-size='32' text-anchor='middle' fill='%23fff' font-family='serif' font-weight='bold'%3E%E9%99%88%3C/text%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html[data-theme="dark"]{
  --bg:#0c0d11;--bg2:#101118;--surface:#15161d;--surface2:#1b1d26;--surface3:#22242f;
  --border:#262837;--border2:#323547;--text:#e9eaf0;--text2:#9da0b4;--text3:#6b6e82;
  --accent:#8f7ff0;--accent-strong:#7a68ea;--accent-soft:rgba(143,127,240,.14);--accent-glow:rgba(143,127,240,.32);
  --ok:#4ade80;--warn:#fbbf24;--err:#f87171;--code-bg:#101119;--code-head:#181a24;
  --shadow:0 12px 40px rgba(0,0,0,.5);--overlay:rgba(8,9,14,.62);
}
html[data-theme="light"]{
  --bg:#f4f5f9;--bg2:#eef0f5;--surface:#ffffff;--surface2:#f4f5fa;--surface3:#e9ebf2;
  --border:#dfe1ea;--border2:#c9ccda;--text:#212229;--text2:#5b5e6e;--text3:#8b8e9e;
  --accent:#6c5ce7;--accent-strong:#5a4bd5;--accent-soft:rgba(108,92,231,.10);--accent-glow:rgba(108,92,231,.22);
  --ok:#16a34a;--warn:#d97706;--err:#dc2626;--code-bg:#f6f7fb;--code-head:#eceef5;
  --shadow:0 12px 40px rgba(30,32,60,.14);--overlay:rgba(20,22,40,.42);
}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.65;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:9px 12px;outline:none;transition:border-color .15s, box-shadow .15s}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
::selection{background:var(--accent-glow)}
.hidden{display:none!important}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:var(--text3)}
::-webkit-scrollbar-track{background:transparent}

#app{display:flex;height:100dvh;width:100%}

/* ---------- 侧栏 ---------- */
#sidebar{width:266px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:transform .25s ease;z-index:40}
.side-head{display:flex;align-items:center;gap:10px;padding:16px 14px 12px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#8f7ff0,#5a4bd5);display:flex;align-items:center;justify-content:center;color:#fff;font-size:19px;font-weight:700;font-family:serif;box-shadow:0 4px 14px var(--accent-glow);flex-shrink:0}
.side-title{flex:1;min-width:0;line-height:1.25}
.side-title b{font-size:16px;display:block}
.side-title span{font-size:11.5px;color:var(--text3);display:block}
.btn-new{margin:2px 12px 10px;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;font-size:14px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-strong));box-shadow:0 4px 14px var(--accent-glow);transition:transform .12s, box-shadow .12s}
.btn-new:hover{transform:translateY(-1px);box-shadow:0 6px 20px var(--accent-glow)}
.btn-new:active{transform:translateY(0)}
.side-label{padding:6px 20px 4px;font-size:11px;color:var(--text3);letter-spacing:.08em}
.conv-list{flex:1;overflow-y:auto;padding:0 8px 8px}
.conv-item{position:relative;display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:10px;cursor:pointer;margin-bottom:2px;border:1px solid transparent}
.conv-item:hover{background:var(--surface2)}
.conv-item.active{background:var(--surface2);border-color:var(--border)}
.conv-item.active::before{content:"";position:absolute;left:-4px;top:20%;bottom:20%;width:3px;border-radius:3px;background:var(--accent)}
.conv-main{flex:1;min-width:0}
.conv-title{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-title input{width:100%;padding:3px 6px;font-size:13px;border-radius:6px}
.conv-meta{font-size:11px;color:var(--text3);margin-top:1px}
.conv-acts{display:none;gap:2px;flex-shrink:0}
.conv-item:hover .conv-acts{display:flex}
.conv-acts button{padding:4px;border-radius:6px;color:var(--text3)}
.conv-acts button:hover{background:var(--surface3);color:var(--text)}
.conv-empty{text-align:center;color:var(--text3);font-size:12.5px;padding:26px 10px}
.side-foot{border-top:1px solid var(--border);padding:8px;display:flex;gap:4px}
.side-foot button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 4px;border-radius:10px;font-size:12.5px;color:var(--text2)}
.side-foot button:hover{background:var(--surface2);color:var(--text)}
.side-foot em{font-style:normal;background:var(--accent-soft);color:var(--accent);border-radius:99px;font-size:10.5px;padding:1px 7px}

/* ---------- 主区 ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.topbar{height:54px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--border);background:var(--bg)}
.icon-btn{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:background .15s,color .15s;flex-shrink:0}
.icon-btn:hover{background:var(--surface2);color:var(--text)}
.icon-btn svg{pointer-events:none}
#btn-menu{display:none}
.mode-bar{display:flex;gap:2px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:3px}
.mode-pill{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:9px;font-size:12.5px;color:var(--text2);transition:all .15s;white-space:nowrap}
.mode-pill:hover{color:var(--text)}
.mode-pill.active{background:var(--surface);color:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.18)}
.top-spacer{flex:1}
.model-badge{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;background:var(--surface2);border:1px solid var(--border);font-size:12px;color:var(--text2);max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.model-badge:hover{border-color:var(--accent)}
.model-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex-shrink:0}
.model-badge.warn .dot{background:var(--warn)}
.model-badge.err .dot{background:var(--err)}

.banner{display:flex;align-items:center;gap:10px;padding:8px 16px;background:color-mix(in srgb, var(--warn) 12%, transparent);border-bottom:1px solid color-mix(in srgb, var(--warn) 28%, transparent);font-size:13px;color:var(--text)}
.banner svg{color:var(--warn);flex-shrink:0}
.banner button{margin-left:auto;padding:4px 12px;border-radius:8px;background:var(--warn);color:#1a1a1a;font-size:12.5px;font-weight:600}

.chat-scroll{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
.chat-inner{max-width:860px;margin:0 auto;padding:24px 20px 12px}

/* ---------- 欢迎页 ---------- */
.welcome{padding:5vh 0 20px;text-align:center;animation:fadeUp .4s ease}
.welcome .logo-lg{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#8f7ff0,#5a4bd5);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:32px;font-weight:700;font-family:serif;box-shadow:0 10px 34px var(--accent-glow)}
.welcome h1{font-size:30px;margin:18px 0 6px;letter-spacing:.02em}
.welcome .tagline{color:var(--text2);font-size:14.5px}
.welcome .tagline b{color:var(--accent)}
.mode-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:34px 0 10px;text-align:left}
.mode-card{display:flex;gap:12px;padding:16px;border-radius:14px;background:var(--surface);border:1px solid var(--border);cursor:pointer;transition:all .18s}
.mode-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 24px var(--accent-glow)}
.mode-card .mc-icon{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mode-card b{font-size:14.5px;display:block;margin-bottom:2px}
.mode-card span{font-size:12.5px;color:var(--text3);line-height:1.45;display:block}
.chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:22px}
.chip{padding:7px 14px;border-radius:99px;background:var(--surface);border:1px solid var(--border);font-size:12.5px;color:var(--text2);cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- 消息 ---------- */
.messages{display:flex;flex-direction:column;gap:22px;padding-bottom:10px}
.msg-row{display:flex;gap:12px;animation:fadeUp .28s ease}
.msg-row.user{justify-content:flex-end}
.msg-row.user .bubble{background:linear-gradient(135deg,var(--accent),var(--accent-strong));color:#fff;border-radius:16px 16px 4px 16px;padding:11px 16px;max-width:78%;box-shadow:0 4px 16px var(--accent-glow)}
.msg-ava{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#8f7ff0,#5a4bd5);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;font-family:serif;flex-shrink:0;box-shadow:0 3px 10px var(--accent-glow)}
.msg-body{min-width:0;max-width:calc(100% - 46px);display:flex;flex-direction:column}
.msg-row.user .msg-body{align-items:flex-end}
.bubble{background:var(--surface);border:1px solid var(--border);border-radius:4px 16px 16px 16px;padding:13px 16px;overflow-wrap:break-word}
.foot-actions{display:flex;gap:4px;padding:6px 2px 0;opacity:0;transition:opacity .15s}
.msg-row:hover .foot-actions{opacity:1}
.foot-actions button{display:flex;align-items:center;gap:5px;padding:4px 9px;border-radius:8px;font-size:12px;color:var(--text3)}
.foot-actions button:hover{background:var(--surface2);color:var(--text)}

/* Markdown 内容 */
.md>*:first-child{margin-top:0}
.md>*:last-child{margin-bottom:0}
.md p{margin:8px 0}
.md h1,.md h2,.md h3,.md h4{margin:18px 0 8px;line-height:1.35}
.md h1{font-size:20px}.md h2{font-size:18px}.md h3{font-size:16px}.md h4{font-size:15px}
.md ul,.md ol{margin:8px 0;padding-left:22px}
.md li{margin:4px 0}
.md blockquote{margin:10px 0;padding:6px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;color:var(--text2)}
.md code{font-family:"JetBrains Mono",ui-monospace,Consolas,"Courier New",monospace;font-size:.88em;background:var(--surface3);border:1px solid var(--border);border-radius:5px;padding:1px 6px}
.md pre{margin:12px 0;border-radius:12px;overflow:hidden;border:1px solid var(--border);background:var(--code-bg)}
.md pre code{display:block;background:none;border:none;padding:0;font-size:13px;line-height:1.6;overflow-x:auto;padding:13px 15px}
.md .code-head{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 6px 14px;background:var(--code-head);border-bottom:1px solid var(--border);font-size:11.5px;color:var(--text3)}
.md .code-head .lang{text-transform:uppercase;letter-spacing:.06em;font-family:ui-monospace,Consolas,monospace}
.md .code-head button{display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:6px;color:var(--text3);font-size:11.5px}
.md .code-head button:hover{background:var(--surface3);color:var(--text)}
.md a{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent}
.md a:hover{border-bottom-color:var(--accent)}
.md img{max-width:100%;border-radius:10px;margin:8px 0}
.md table{border-collapse:collapse;margin:12px 0;width:100%;font-size:13.5px;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--border);padding:7px 12px;text-align:left}
.md th{background:var(--surface2)}
.md tr:nth-child(even) td{background:color-mix(in srgb,var(--surface2) 45%,transparent)}
.md hr{border:none;border-top:1px solid var(--border);margin:16px 0}
.tok-kw{color:#c792ea}.tok-str{color:#a5d6a7}.tok-num{color:#f7b26b}.tok-com{color:#5d6172;font-style:italic}.tok-fn{color:#7cc7ff}.tok-cls{color:#ffd580}
html[data-theme="light"] .tok-kw{color:#8e44ad}html[data-theme="light"] .tok-str{color:#1e8449}html[data-theme="light"] .tok-num{color:#c2571a}html[data-theme="light"] .tok-com{color:#9aa0b4}html[data-theme="light"] .tok-fn{color:#1565c0}html[data-theme="light"] .tok-cls{color:#a06a00}
.md details.think{margin:0 0 12px;border:1px dashed var(--border2);border-radius:10px;padding:0;overflow:hidden}
.md details.think summary{cursor:pointer;padding:7px 12px;font-size:12px;color:var(--text3);background:var(--surface2);user-select:none;list-style:none}
.md details.think summary::before{content:"◈ ";}
.md details.think .think-body{padding:10px 14px;font-size:12.5px;color:var(--text2);white-space:pre-wrap;word-break:break-word;border-top:1px dashed var(--border)}
.md details.think[open] summary{border-bottom:1px dashed var(--border)}

.typing{display:inline-flex;gap:5px;padding:4px 2px}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--text3);animation:tp 1.2s infinite ease-in-out}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
.error-card{border:1px solid color-mix(in srgb,var(--err) 40%,transparent);background:color-mix(in srgb,var(--err) 10%,transparent);border-radius:10px;padding:11px 14px;font-size:13.5px;color:var(--err)}
.error-card .retry-btn{margin-top:8px;padding:4px 12px;border-radius:8px;border:1px solid color-mix(in srgb,var(--err) 50%,transparent);color:var(--err);font-size:12.5px}

/* 工具区 */
.tool-zone{display:flex;flex-direction:column;gap:8px;margin:10px 0 4px}
.tool-card{border:1px solid var(--border);border-radius:11px;background:var(--surface2);overflow:hidden}
.tool-head{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:12.5px;cursor:pointer;user-select:none}
.tool-head .t-ic{width:24px;height:24px;border-radius:7px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tool-head b{font-family:ui-monospace,Consolas,monospace;font-size:12px;font-weight:600}
.tool-status{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text3)}
.tool-card[data-status="running"] .tool-status{color:var(--accent)}
.tool-card[data-status="ok"] .tool-status{color:var(--ok)}
.tool-card[data-status="error"] .tool-status{color:var(--err)}
.tool-card[data-status="running"]{border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.tool-card[data-status="error"]{border-color:color-mix(in srgb,var(--err) 45%,transparent)}
.spinner{width:12px;height:12px;border:2px solid var(--accent-soft);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.tool-detail{display:none;border-top:1px solid var(--border)}
.tool-card.open .tool-detail{display:block}
.tool-detail pre{margin:0;padding:10px 12px;font-size:12px;font-family:ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-word;color:var(--text2);max-height:220px;overflow-y:auto}
.tool-detail .lbl{font-size:10.5px;color:var(--text3);padding:6px 12px 0;letter-spacing:.08em}

/* ---------- 输入区 ---------- */
.composer-wrap{flex-shrink:0;padding:8px 20px 14px}
.composer-wrap-inner{max-width:860px;margin:0 auto}
.composer{display:flex;align-items:flex-end;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:10px 12px;transition:border-color .15s,box-shadow .15s}
.composer:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),0 6px 24px var(--accent-glow)}
.composer textarea{flex:1;background:none;border:none;resize:none;max-height:200px;min-height:24px;padding:2px 0;font-size:14.5px;line-height:1.55;border-radius:0}
.composer textarea:focus{box-shadow:none;border:none}
.composer-actions{display:flex;gap:6px;flex-shrink:0}
.btn-send{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent-strong));color:#fff;display:flex;align-items:center;justify-content:center;transition:all .15s;box-shadow:0 4px 12px var(--accent-glow)}
.btn-send:hover:not(:disabled){transform:translateY(-1px)}
.btn-send:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.btn-stop{height:38px;padding:0 16px;border-radius:11px;background:var(--surface3);color:var(--text2);font-size:13px;display:flex;align-items:center;gap:6px}
.btn-stop:hover{color:var(--err)}
.composer-hint{text-align:center;font-size:11px;color:var(--text3);margin-top:8px}

/* ---------- 弹层 ---------- */
.overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--overlay);backdrop-filter:blur(6px);animation:fadeIn .18s ease}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:18px;width:min(600px,100%);max-height:88dvh;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:popIn .22s cubic-bezier(.2,.9,.3,1.2)}
.modal-sm{width:min(400px,100%)}
.modal-head{display:flex;align-items:center;padding:16px 20px 12px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:16px;flex:1}
.modal-body{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:15px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--border)}
.modal label{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--text2)}
.modal input,.modal select{width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hint{font-size:12px;color:var(--text3);line-height:1.5;background:var(--surface2);border-radius:9px;padding:9px 12px}
.hint.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 9%,transparent)}
.btn-primary{padding:9px 22px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-strong));color:#fff;font-size:13.5px;font-weight:600;transition:all .15s}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 14px var(--accent-glow)}
.btn-ghost{padding:9px 18px;border-radius:10px;background:var(--surface2);border:1px solid var(--border);font-size:13.5px;color:var(--text2)}
.btn-ghost:hover{color:var(--text);border-color:var(--border2)}
.btn-danger-ghost{padding:8px 16px;border-radius:10px;border:1px solid color-mix(in srgb,var(--err) 40%,transparent);color:var(--err);font-size:13px}
.btn-danger-ghost:hover{background:color-mix(in srgb,var(--err) 10%,transparent)}
.set-actions{display:flex;align-items:center;gap:12px}
#test-status{font-size:12.5px}
#test-status.ok{color:var(--ok)}#test-status.err{color:var(--err)}#test-status.loading{color:var(--accent)}
.danger-zone{border-top:1px dashed var(--border);padding-top:14px}

/* 知识库 */
.kb-add{border:2px dashed var(--border2);border-radius:14px;padding:14px;transition:all .15s}
.kb-add.dragover{border-color:var(--accent);background:var(--accent-soft)}
.kb-add textarea{width:100%;min-height:90px;resize:vertical;margin-bottom:10px}
.kb-add-row{display:flex;gap:8px;flex-wrap:wrap}
.kb-add-row input{flex:1;min-width:140px}
.kb-add-row .btn-primary{padding:9px 16px}
.kb-add-row .btn-ghost{padding:9px 14px}
.kb-list{display:flex;flex-direction:column;gap:9px}
.kb-item{border:1px solid var(--border);border-radius:11px;padding:11px 13px;background:var(--surface2)}
.kb-item .kb-item-head{display:flex;align-items:center;gap:8px}
.kb-item b{font-size:13.5px;flex:1}
.kb-item .kb-item-head button{padding:4px;border-radius:6px;color:var(--text3)}
.kb-item .kb-item-head button:hover{color:var(--err);background:var(--surface3)}
.kb-item p{font-size:12.5px;color:var(--text3);margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kb-empty{text-align:center;color:var(--text3);font-size:13px;padding:22px}

/* 待办 */
.todo-add{display:flex;gap:9px}
.todo-add input{flex:1}
.todo-add button{padding:0 20px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-strong));color:#fff;font-size:13.5px}
.todo-list{display:flex;flex-direction:column;gap:7px}
.todo-item{display:flex;align-items:center;gap:11px;padding:10px 13px;border:1px solid var(--border);border-radius:11px;background:var(--surface2)}
.todo-check{width:19px;height:19px;border-radius:6px;border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;transition:all .15s;cursor:pointer}
.todo-item.done .todo-check{background:var(--accent);border-color:var(--accent)}
.todo-text{flex:1;font-size:13.5px;word-break:break-all}
.todo-item.done .todo-text{color:var(--text3);text-decoration:line-through}
.todo-time{font-size:11px;color:var(--text3)}
.todo-item button{padding:4px;border-radius:6px;color:var(--text3)}
.todo-item button:hover{color:var(--err);background:var(--surface3)}
.todo-empty{text-align:center;color:var(--text3);font-size:13px;padding:22px}

/* 确认框 / Toast */
#ov-confirm p{font-size:14.5px;line-height:1.6}
#toasts{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 18px;font-size:13px;box-shadow:var(--shadow);animation:fadeUp .25s ease;max-width:86vw}
.toast.ok{border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.toast.err{border-color:color-mix(in srgb,var(--err) 50%,transparent)}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}

#side-backdrop{display:none}

/* ---------- 移动端 ---------- */
@media (max-width:880px){
  #sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-105%);box-shadow:var(--shadow)}
  #sidebar.open{transform:translateX(0)}
  #side-backdrop{display:none;position:fixed;inset:0;z-index:35;background:var(--overlay);backdrop-filter:blur(2px)}
  #side-backdrop.show{display:block}
  #btn-menu{display:flex}
  #btn-side-close{display:flex}
  .chat-inner{padding:16px 12px 8px}
  .msg-body{max-width:calc(100% - 40px)}
  .msg-row.user .bubble{max-width:92%}
  .mode-bar{overflow-x:auto;max-width:52vw}
  .model-badge{max-width:38vw}
  .mode-cards{grid-template-columns:1fr}
  .composer-wrap{padding:6px 10px 10px}
  .welcome h1{font-size:26px}
}
@media (min-width:881px){#btn-side-close{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<div id="app">
  <aside id="sidebar">
    <div class="side-head">
      <div class="logo">陈</div>
      <div class="side-title"><b>陈生</b><span>话不多，事都办</span></div>

  <div id="side-backdrop"></div>

      <button id="btn-theme" class="icon-btn" title="切换主题"><i data-icon="moon" id="theme-icon"></i></button>

    <div id="banner" class="banner hidden">
      <i data-icon="warn"></i>
      <span id="banner-text">尚未配置 API，无法开始对话</span>
      <button id="banner-btn">去设置</button>

    <div class="chat-scroll" id="chat-scroll">
      <div class="chat-inner">
        <div id="welcome" class="welcome"></div>
        <div id="messages" class="messages"></div>
      </div>
    </div>
    <div class="composer-wrap">

        <div class="composer">
          <textarea id="input" rows="1" placeholder="有事，说。（Enter 发送 · Shift+Enter 换行）"></textarea>

            <button id="btn-send" class="btn-send" title="发送" disabled><i data-icon="send" data-size="17"></i></button>

        </div>

      </div>
    </div>

</div>

<!-- 设置 -->
<div class="overlay hidden" id="ov-settings">

      </label>
      <label>API Key
        <input id="set-key" type="password" placeholder="sk-..." spellcheck="false" autocomplete="off">
      </label>
      <label>模型
        <input id="set-model" list="model-list" placeholder="deepseek-flash" spellcheck="false">
        <datalist id="model-list"></datalist>
      </label>

    </div>
    <div class="modal-foot"><button class="btn-ghost ov-close">取消</button><button id="btn-save-settings" class="btn-primary">保存</button></div>

<!-- 知识库 -->
<div class="overlay hidden" id="ov-kb">

</div>

<!-- 待办 -->
<div class="overlay hidden" id="ov-todo">

  const diff = Date.now() - ts;

function fmtNum(v){
  if (!isFinite(v)) return String(v);
  if (Math.abs(v) >= 1e16 || (Math.abs(v) < 1e-8 && v !== 0)) return v.toExponential(6);
  const r = Math.round(v * 1e10) / 1e10;
  return String(r);
}
function calcExpression(src){
  let s = String(src || '').trim();
  s = s.replace(/(\d)\s*,\s*(?=\d{3}(\D|$))/g, '$1');
  s = s.replace(/[×✕]/g, '*').replace(/[÷]/g, '/').replace(/[−–—]/g, '-').replace(/（/g, '(').replace(/）/g, ')');
  s = s.replace(/π/g, 'pi').replace(/√\s*/g, 'sqrt').replace(/\s+/g, '');

    sqrt:Math.sqrt, abs:Math.abs, ln:Math.log, log:Math.log10, exp:Math.exp,
    sin:Math.sin, cos:Math.cos, tan:Math.tan, asin:Math.asin, acos:Math.acos, atan:Math.atan,
    floor:Math.floor, ceil:Math.ceil, round:Math.round, sign:Math.sign, cbrt:Math.cbrt
  };
  const CONST = { pi:Math.PI, e:Math.E, tau:Math.PI*2 };
  function expr0(){
    let v = term();
    for(;;){
      const c = s[i];
      if (c === '+' || c === '-'){ i++; const r = term(); v = c === '+' ? v + r : v - r; } else break;
    }
    return v;
  }
  function term(){
    let v = unary();
    for(;;){
      const c = s[i];
      if (c === '*' || c === '/' || c === '%'){
        i++; const r = unary();
        if (c === '*') v = v * r;
        else if (c === '/'){ if (r === 0) throw new Error('除数为零'); v = v / r; }
        else { if (r === 0) throw new Error('取模的除数为零'); v = v % r; }
      } else break;
    }
    return v;
  }
  function unary(){
    if (s[i] === '-'){ i++; return -unary(); }
    if (s[i] === '+'){ i++; return unary(); }
    return power();
  }
  function power(){
    const base = primary();
    if (s[i] === '^'){ i++; const e = unary(); return Math.pow(base, e); }
    return base;
  }
  function primary(){
    const c = s[i];
    if (c === undefined) throw new Error('表达式不完整');
    if (c === '('){ i++; const v = expr0(); if (s[i] !== ')') throw new Error('括号不匹配'); i++; return v; }
    if (/[0-9.]/.test(c)){
      let j = i;
      while (j < n && /[0-9.]/.test(s[j])) j++;
      if ((s[j] === 'e' || s[j] === 'E') && /[0-9+\-]/.test(s[j+1] || '')){
        j++;
        if (s[j] === '+' || s[j] === '-') j++;
        while (j < n && /[0-9]/.test(s[j])) j++;
      }
      const num = parseFloat(s.slice(i, j));
      if (isNaN(num)) throw new Error('数字格式错误：' + s.slice(i, j));
      i = j; return num;
    }
    if (/[a-zA-Z_]/.test(c)){
      let j = i;
      while (j < n && /[a-zA-Z_0-9]/.test(s[j])) j++;
      const name = s.slice(i, j).toLowerCase();
      i = j;
      if (name in CONST) return CONST[name];
      if (s[i] === '('){
        i++; const v = expr0();
        if (s[i] !== ')') throw new Error('函数括号不匹配');
        i++;
        if (!(name in FN)) throw new Error('不支持的函数：' + name + '（支持 ' + Object.keys(FN).join(', ') + '）');
        return FN[name](v);
      }
      throw new Error('未知符号：' + name);
    }
    throw new Error('无法解析：' + c);
  }
  const v = expr0();
  if (i < n) throw new Error('多余的内容：' + s.slice(i));
  return v;
}

function parseDateStr(v){
  if (v == null || String(v).trim() === '') return null;
  const s = String(v).trim().toLowerCase().replace(/\s*日\s*$/, '').replace(/年|月/g, '-');
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if (s === 'now' || s === '现在') return { date: now, label: '现在' };
  if (s === 'today' || s === '今天') return { date: today, label: '今天' };
  if (s === 'tomorrow' || s === '明天'){ const d = new Date(today); d.setDate(d.getDate()+1); return { date: d, label: '明天' }; }
  if (s === 'yesterday' || s === '昨天'){ const d = new Date(today); d.setDate(d.getDate()-1); return { date: d, label: '昨天' }; }
  let m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/);
  if (m) return { date: new Date(+m[1], +m[2]-1, +m[3]), label: `${m[1]}-${pad2(m[2])}-${pad2(m[3])}` };
  m = s.match(/^(\d{1,2})[-/.](\d{1,2})$/);
  if (m) return { date: new Date(now.getFullYear(), +m[1]-1, +m[2]), label: `${now.getFullYear()}-${pad2(m[1])}-${pad2(m[2])}` };
  const d = new Date(s);
  if (!isNaN(d)) return { date: d, label: s };
  return null;
}
function addMonths(d, n){
  const r = new Date(d);
  const day = r.getDate();
  r.setDate(1); r.setMonth(r.getMonth() + n);
  const dim = new Date(r.getFullYear(), r.getMonth() + 1, 0).getDate();
  r.setDate(Math.min(day, dim));
  return r;
}
function toolDateCalc(args){
  const op = (args.operation || '').toLowerCase();
  const WD = ['日','一','二','三','四','五','六'];
  const dts = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
  if (op === 'diff'){
    const a = parseDateStr(args.date1 ?? args.date), b = parseDateStr(args.date2);
    if (!a || !b) throw new Error('请提供 date1 和 date2（支持 today/tomorrow/昨天/2026-10-10 等格式）');
    const days = Math.round((b.date.getTime() - a.date.getTime()) / 86400e3);
    return { date1: a.label, date2: b.label, days, weeks: +(days / 7).toFixed(1), months: +(days / 30.4375).toFixed(1), text: `${a.label} 到 ${b.label} 相差 ${days} 天（约 ${(days/7).toFixed(1)} 周 / ${(days/30.4375).toFixed(1)} 个月）` };
  }
  if (op === 'add' || op === 'subtract'){
    const base = parseDateStr(args.base_date ?? args.date);
    if (!base) throw new Error('请提供 base_date');
    let amount = Number(args.amount);
    if (!isFinite(amount)) throw new Error('amount 必须是数字');
    if (op === 'subtract') amount = -amount;
    const unit = (args.unit || 'days').toLowerCase();
    let result;
    if (unit.startsWith('day') || unit === '天') result = new Date(base.date.getTime() + amount * 86400e3);
    else if (unit.startsWith('week') || unit === '周' || unit === '星期') result = new Date(base.date.getTime() + amount * 7 * 86400e3);
    else if (unit.startsWith('month') || unit === '月') result = addMonths(base.date, amount);
    else if (unit.startsWith('year') || unit === '年') result = addMonths(base.date, amount * 12);
    else throw new Error('unit 支持 days/weeks/months/years');
    return { base: base.label, operation: op, amount: Math.abs(Number(args.amount)), unit, result: dts(result), weekday: '星期' + WD[result.getDay()], text: `${base.label} ${op === 'add' ? '往后' : '往前'} ${Math.abs(Number(args.amount))} ${unit} 是 ${dts(result)}（星期${WD[result.getDay()]}）` };
  }
  if (op === 'weekday' || op === 'day_of_week'){
    const d = parseDateStr(args.date);
    if (!d) throw new Error('请提供 date');
    return { date: d.label, weekday: '星期' + WD[d.date.getDay()], is_weekend: d.date.getDay() === 0 || d.date.getDay() === 6 };
  }
  throw new Error('operation 支持 diff / add / subtract / weekday');
}

const TEMP_UNITS = { c:'c', celsius:'c', '℃':'c', 摄氏度:'c', 摄氏:'c', centigrade:'c', f:'f', fahrenheit:'f', '℉':'f', 华氏度:'f', 华氏:'f', k:'k', kelvin:'k', 开尔文:'k' };
function normUnit(u){
  const key = String(u || '').trim().toLowerCase();
  if (!key) return null;
  if (TEMP_UNITS[key]) return { cat:'temperature', name:TEMP_UNITS[key] };
  for (const cat in UNITS){
    if (UNITS[cat][key] !== undefined) return { cat, name:key, factor:UNITS[cat][key] };
  }
  const s = key.replace(/s$/, '');
  for (const cat in UNITS){
    if (UNITS[cat][s] !== undefined) return { cat, name:s, factor:UNITS[cat][s] };
  }
  return null;
}
function toolUnitConvert(args){
  const v = Number(args.value);
  if (!isFinite(v)) throw new Error('value 必须是数字');
  const from = normUnit(args.from), to = normUnit(args.to);
  if (!from) throw new Error('无法识别单位：' + args.from);
  if (!to) throw new Error('无法识别单位：' + args.to);
  if (from.cat !== to.cat) throw new Error(`单位不属于同一类（${from.cat} vs ${to.cat}），不能互转`);
  let out;
  if (from.cat === 'temperature'){
    let c;
    if (from.name === 'c') c = v;
    else if (from.name === 'f') c = (v - 32) * 5 / 9;
    else c = v - 273.15;
    if (to.name === 'c') out = c;
    else if (to.name === 'f') out = c * 9 / 5 + 32;
    else out = c + 273.15;
  } else {
    out = v * from.factor / to.factor;
  }
  return { input: `${fmtNum(v)} ${args.from}`, output: `${fmtNum(out)} ${args.to}`, category: from.cat, value: out, text: `${fmtNum(v)} ${args.from} = ${fmtNum(out)} ${args.to}` };
}
const KB_STOP = new Set(['的','了','是','在','我','有','和','就','不','人','都','一','一个','你','很','也','吗','吧','呢','啊','什么','怎么','如何','请问','请','能否','可以','这个','那个','还是','以及','因为','所以','但是','然后','就是','没有','一下','时候','自己','他们','我们','你们','它','他','她','被','把','让','给','到','都','还','再','又','才','只','会','能','要','想','说','做','去','来','看','知道','介绍','描述','解释','告诉']);
function extractTerms(text){
  const t = String(text || '').toLowerCase();
  const terms = new Set();
  for (const m of t.matchAll(/[a-z][a-z0-9_+#.-]{1,}/g)){
    const w = m[0].replace(/[.]+$/, '');
    if (w.length >= 2) terms.add(w);
  }
  const han = t.match(/[\u4e00-\u9fff]+/g) || [];
  for (const seg of han){
    if (seg.length === 1) terms.add(seg);
    else for (let i = 0; i < seg.length - 1; i++) terms.add(seg.slice(i, i+2));
  }
  return [...terms].filter(x => !KB_STOP.has(x));
}
function toolSearchKnowledge(args){
  const q = String(args.query || '').trim();
  if (!q) throw new Error('query 不能为空');
  if (!state.kb.length) return { found:false, note:'知识库当前为空，请在知识库面板添加内容后再试' };
  const terms = extractTerms(q);
  if (!terms.length) return { found:false, note:'未能从问题中提取关键词' };
  const top_k = Math.min(Math.max(Number(args.top_k) || 3, 1), 5);
  const scored = state.kb.map(item => {
    const title = (item.title || '').toLowerCase(), content = (item.content || '').toLowerCase();
    let score = 0;
    for (const t of terms){
      if (title.includes(t)) score += 5;
      if (content.includes(t)) score += 1;
    }
    return { item, score };
  }).filter(x => x.score > 0).sort((a, b) => b.score - a.score).slice(0, top_k);
  if (!scored.length) return { found:false, note:'知识库中没有与「' + q + '」相关的内容' };
  return {
    found: true, query: q,
    results: scored.map(x => ({
      title: x.item.title,
      content: String(x.item.content || '').slice(0, 600),
      score: x.score
    }))
  };
}

function toolTodoManager(args){

    const want = action === 'complete';

    if (!item && args.title){
      const q = String(args.title).trim().toLowerCase();
      item = state.todos.find(t => t.title.toLowerCase().includes(q) || q.includes(t.title.toLowerCase()));
    }
    if (!item) throw new Error('未找到该待办（可传 id 或 title）');
    item.done = want; syncTodo();
    return { ok:true, action, item, text: `${want ? '已完成' : '已取消完成'}「${item.title}」` };
  }
  if (action === 'clear'){
    const n = state.todos.length;
    state.todos = []; syncTodo();
    return { ok:true, action:'clear', removed:n, text:`已清空 ${n} 条待办` };
  }
  if (action === 'delete' || action === 'remove'){
    let idx = -1;
    if (args.id != null && args.id !== '') idx = state.todos.findIndex(t => t.id === String(args.id));
    if (idx < 0 && args.title){
      const q = String(args.title).trim().toLowerCase();
      idx = state.todos.findIndex(t => t.title.toLowerCase().includes(q));
    }
    if (idx < 0) throw new Error('未找到该待办');
    const [item] = state.todos.splice(idx, 1); syncTodo();
    return { ok:true, action:'delete', item, text:`已删除待办「${item.title}」` };
  }
  throw new Error('action 支持 add / list / complete / uncomplete / delete / clear');
}

async function* streamRequest(payload, signal){
  const base = String(state.settings.baseUrl || '').trim().replace(/\/+$/, '');
  if (!base){ const e = new Error('请先在设置中配置 API 地址'); e.kind = 'config'; throw e; }
  if (!state.settings.apiKey){ const e = new Error('请先在设置中配置 API Key'); e.kind = 'config'; throw e; }
  const body = {
    model: state.settings.model,
    messages: payload.messages,
    stream: true,
    temperature: Number(state.settings.temperature) || 0
  };
  if (payload.tools && payload.tools.length){
    body.tools = payload.tools.map(t => ({ type:'function', function:{ name:t.name, description:t.description, parameters:t.parameters } }));
  }
  let res;
  try{
    res = await fetch(base + '/chat/completions', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + state.settings.apiKey },
      body: JSON.stringify(body),

  }catch(err){
    if (err.name === 'AbortError') throw err;

    }catch{ try{ msg = (await res.text()).slice(0, 200) || msg; }catch{} }

    let nl;
    while ((nl = buf.indexOf('\n')) >= 0){
      const raw = buf.slice(0, nl); buf = buf.slice(nl + 1);
      const line = raw.replace(/\r$/, '');
      if (!line || line.startsWith(':')) continue;
      if (!line.startsWith('data:')) continue;
      const data = line.slice(5).trim();
      if (data === '[DONE]') break outer;
      let j;
      try{ j = JSON.parse(data); }catch{ continue; }
      const delta = (j.choices && j.choices[0] && j.choices[0].delta) || {};
      if (delta.reasoning_content) yield { type:'reasoning', delta: delta.reasoning_content };
      if (delta.reasoning) yield { type:'reasoning', delta: delta.reasoning };
      if (delta.content) yield { type:'text', delta: delta.content };
      if (delta.tool_calls && delta.tool_calls.length){
        for (const tc of delta.tool_calls){
          const idx = (tc.index != null && tc.index !== undefined) ? tc.index : toolAcc.length;
          toolAcc[idx] = toolAcc[idx] || { id:'', name:'', args:'' };
          if (tc.id) toolAcc[idx].id = tc.id;
          if (tc.function && tc.function.name){ toolAcc[idx].name = tc.function.name; toolNames.add(tc.function.name); }
          if (tc.function && tc.function.arguments) toolAcc[idx].args += tc.function.arguments;
        }
        yield* emitToolPending();
      }
    }
  }
  const valid = toolAcc.filter(t => t && t.name);
  if (valid.length){
    yield { type:'tool_calls', calls: valid.map(t => ({ id: t.id || ('call_' + uid()), name: t.name, args: t.args || '{}' })) };
  }
}
function friendlyError(err){

  return err.message || String(err);
}

function highlightCode(code, lang){
  const cfg = HL_CFG[(lang || '').toLowerCase()] || { lc:null, bc:null, q:['"',"'"], kw:[] };
  let out = '';
  let i = 0; const n = code.length;
  const push = (txt, cls) => { out += cls ? '<span class="' + cls + '">' + esc(txt) + '</span>' : esc(txt); };
  while (i < n){
    if (cfg.lc && code.startsWith(cfg.lc, i)){
      let j = code.indexOf('\n', i); if (j < 0) j = n;
      push(code.slice(i, j), 'tok-com'); i = j; continue;
    }
    if (cfg.bc){
      const [a, b] = cfg.bc;
      if (code.startsWith(a, i)){
        let j = code.indexOf(b, i + a.length); j = j < 0 ? n : j + b.length;
        push(code.slice(i, j), 'tok-com'); i = j; continue;
      }
    }
    const ch = code[i];
    if (cfg.q.includes(ch)){
      let j = i + 1;
      while (j < n){
        if (code[j] === '\\'){ j += 2; continue; }
        if (code[j] === ch){ j++; break; }
        if (ch !== '`' && code[j] === '\n') break;
        j++;
      }
      push(code.slice(i, j), 'tok-str'); i = j; continue;
    }
    if (/[0-9]/.test(ch) && !/[a-zA-Z_]/.test(code[i-1] || '')){
      let j = i;
      while (j < n && /[0-9a-fA-FxXoObB._]/.test(code[j])) j++;
      push(code.slice(i, j), 'tok-num'); i = j; continue;
    }
    if (/[A-Za-z_$]/.test(ch)){
      let j = i;
      while (j < n && /[A-Za-z0-9_$]/.test(code[j])) j++;
      const w = code.slice(i, j);
      let cls = null;
      if (cfg.kw.includes(w)) cls = 'tok-kw';
      else if (/^[A-Z]/.test(w)) cls = 'tok-cls';
      else {
        let k = j; while (k < n && /[ \t]/.test(code[k])) k++;
        if (code[k] === '(') cls = 'tok-fn';
      }
      push(w, cls); i = j; continue;
    }
    push(ch, null); i++;
  }
  return out;
}

function inlineMd(s){
  s = s.replace(/!\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)/g, (m, alt, url) => `<img alt="${alt}" src="${esc(url)}" loading="lazy">`);
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (m, t, url) => `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${t}</a>`);
  s = s.replace(/(^|[^="'>])(https?:\/\/[^\s<>()]+[^\s<>().,;:!?'"])/g, (m, pre, url) => `${pre}<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(url)}</a>`);
  s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/__([^_\n]+)__/g, '<strong>$1</strong>');
  s = s.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
  s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
  return s;
}
function renderMarkdown(src){
  if (src == null) return '';
  const codes = [], thinks = [];
  let s = String(src).replace(/\r\n/g, '\n');
  s = s.replace(/<think>([\s\S]*?)(?:<\/think>|$)/g, (m, c) => {
    const inner = c.trim();
    if (!inner) return '';
    thinks.push(inner);
    return '\u0003TK' + (thinks.length - 1) + '\u0003';
  });
  s = s.replace(/```([\w+#.-]*)[^\S\n]*\n?([\s\S]*?)(?:```|$)/g, (m, lang, code) => {
    codes.push({ lang: (lang || '').toLowerCase(), code: code.replace(/\n$/, '') });
    return '\u0002CB' + (codes.length - 1) + '\u0002';
  });
  s = s.replace(/`([^`\n]+)`/g, (m, c) => {
    codes.push({ lang:'', code:c, inline:true });
    return '\u0001IC' + (codes.length - 1) + '\u0001';
  });
  s = esc(s);
  const lines = s.split('\n');
  const out = [];
  let para = [];
  const flush = () => {
    if (para.length){
      const t = para.map(x => x.trim()).filter(Boolean);
      if (t.length) out.push('<p>' + t.map(inlineMd).join('<br>') + '</p>');
      para = [];
    }
  };
  let i = 0;
  while (i < lines.length){
    const raw = lines[i];
    const t = raw.trim();
    if (!t){ flush(); i++; continue; }
    let m;
    if ((m = t.match(/^(#{1,6})\s+(.+)$/))){
      flush();
      const lv = m[1].length;
      const tag = lv <= 1 ? 'h1' : (lv === 2 ? 'h2' : lv === 3 ? 'h3' : 'h4');
      out.push('<' + tag + '>' + inlineMd(m[2].replace(/\s*#+\s*$/, '')) + '</' + tag + '>');
      i++; continue;
    }
    if (/^(-{3,}|\*{3,}|_{3,})$/.test(t)){ flush(); out.push('<hr>'); i++; continue; }
    if ((m = t.match(/^>\s?(.*)$/))){
      flush();
      const q = [m[1]];
      i++;
      while (i < lines.length && (m = lines[i].trim().match(/^>\s?(.*)$/))){ q.push(m[1]); i++; }
      out.push('<blockquote>' + q.map(x => inlineMd(x)).join('<br>') + '</blockquote>');
      continue;
    }
    if (/^(\s*)([-*+]|\d+[.)])\s+/.test(raw)){
      flush();
      const res = parseList(lines, i);
      out.push(res.html);
      i = res.next;
      continue;
    }
    if (t.includes('|') && i + 1 < lines.length && lines[i+1].includes('-') && /^\s*\|?\s*:?-{2,}[\s|:-]*\|/.test(lines[i+1])){
      flush();
      const head = t.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].includes('|') && lines[i].trim()){
        rows.push(lines[i].trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim()));
        i++;
      }
      out.push('<table><thead><tr>' + head.map(c => '<th>' + inlineMd(c) + '</th>').join('') + '</tr></thead><tbody>' +
        rows.map(r => '<tr>' + r.map(c => '<td>' + inlineMd(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table>');
      continue;
    }
    para.push(raw);
    i++;
  }
  flush();
  let html = out.join('\n');
  html = html.replace(/\u0001IC(\d+)\u0001/g, (m, idx) => {
    const c = codes[+idx];
    return c ? '<code>' + esc(c.code) + '</code>' : '';
  });
  html = html.replace(/\u0002CB(\d+)\u0002/g, (m, idx) => {
    const c = codes[+idx];
    return c ? codeBlockHtml(c.lang, c.code) : '';
  });
  html = html.replace(/\u0003TK(\d+)\u0003/g, (m, idx) => {
    const tk = thinks[+idx];
    return tk ? thinkDetailsHtml(tk) : '';
  });
  return html;
}
function parseList(lines, start){
  const items = [];
  let i = start;
  while (i < lines.length){
    const m = lines[i].match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
    if (!m) break;
    items.push({ indent: m[1].replace(/\t/g, '    ').length, ordered: /\d/.test(m[2]), text: m[3] });
    i++;
  }
  const minIndent = items.length ? Math.min(...items.map(x => x.indent)) : 0;
  function build(from, indent){
    let html = '';
    let ordered = null;
    let j = from;
    while (j < items.length){
      const it = items[j];
      if (it.indent < indent) break;
      if (it.indent > indent){
        const sub = build(j, it.indent);
        html = html.replace(/<\/li>$/, sub.html + '</li>');
        j = sub.next;
        continue;
      }
      if (ordered === null){ ordered = it.ordered; html += ordered ? '<ol>' : '<ul>'; }
      else if (it.ordered !== ordered){ html += ordered ? '</ol><ol>' : '</ul><ul>'; ordered = it.ordered; }
      html += '<li>' + inlineMd(it.text) + '</li>';
      j++;
    }
    if (ordered !== null) html += ordered ? '</ol>' : '</ul>';
    return { html, next: j };
  }
  const r = build(0, minIndent);
  return { html: r.html, next: i };
}

function renderContent(row, content, reasoning){

  row._raf = requestAnimationFrame(() => {
    row._raf = null;
    let html = '';

function renderToolZone(row, tools){

          tools.push({
            key: tc.id, name: tc.name, argsPretty: prettyJson(tc.args),
            status: resMsg ? (resMsg.ok === false ? 'error' : 'ok') : 'ok',
            result: resMsg ? summarizeToolResult(resMsg) : null
          });
        }
      }
      const row = buildAssistantRow();
      renderToolZone(row, tools);
      fillAssistantRow(row, m, k === msgs.length - 1);

/* ================= 发送与 Agent 循环 ================= */
const inputEl = $('#input');
function autoGrow(){
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 200) + 'px';
  $('#btn-send').disabled = state.streaming || !inputEl.value.trim();
}
function sendState(on){
  state.streaming = on;
  $('#btn-send').classList.toggle('hidden', on);
  $('#btn-stop').classList.toggle('hidden', !on);
  if (!on) autoGrow();
}
async function sendMessage(presetText){
  if (state.streaming) return;
  const text = String(presetText != null ? presetText : inputEl.value).trim();
  if (!text) return;
  const s = state.settings;
  if (!s.baseUrl || !s.apiKey || !s.model){
    toast('请先配置 API', 'err');
    openSettings();
    return;
  }
  let conv = currentConv();
  if (!conv) conv = newConversation();
  conv.messages.push({ role:'user', content:text, ts:Date.now() });
  conv.updatedAt = Date.now();
  if (conv.title === '新对话') conv.title = text.replace(/\s+/g, ' ').slice(0, 20);
  if (inputEl.value === text || String(presetText != null ? presetText : inputEl.value) === text){
    if (inputEl.value === text){ inputEl.value = ''; autoGrow(); }
  }
  if (presetText != null && inputEl.value === text){ inputEl.value = ''; autoGrow(); }
  renderChat(); renderSidebar(); saveConvs();
  await runAgent(conv);
}
async function runAgent(conv){
  sendState(true);
  state.abort = new AbortController();
  const row = buildAssistantRow();
  $('#messages').appendChild(row.el);
  $('#welcome').style.display = 'none';
  scrollBottom(true);
  renderContent(row, '', '');
  const tools = modeTools(conv.mode);
  const maxRounds = Math.min(Math.max(Number(state.settings.maxRounds) || 8, 1), 8);
  const uiTools = [];
  let content = '', reasoning = '', finalMsg = null;
  try{
    for (let round = 0; round < maxRounds; round++){
      content = ''; reasoning = '';
      let calls = null;
      const apiMsgs = buildApiMessages(conv);
      for await (const ev of streamRequest({ messages: apiMsgs, tools }, state.abort.signal)){
        if (ev.type === 'reasoning'){ reasoning += ev.delta; renderContent(row, content, reasoning); }
        else if (ev.type === 'text'){ content += ev.delta; renderContent(row, content, reasoning); }
        else if (ev.type === 'tool_calls'){ calls = ev.calls; }
      }
      if (calls && calls.length){
        conv.messages.push({ role:'assistant', content, reasoning: reasoning || undefined, toolCalls: calls.map(c => ({ id:c.id, name:c.name, args:c.args })), ts:Date.now() });
        for (const c of calls){
          const ui = { key: c.id, name: c.name, argsPretty: prettyJson(c.args), status:'running' };
          uiTools.push(ui);
          renderToolZone(row, uiTools);
          const res = await executeToolSafe(c.name, c.args);
          ui.status = res.ok ? 'ok' : 'error';
          ui.result = res.ok ? prettyJson(res.result) : ('错误：' + res.error);
          renderToolZone(row, uiTools);
          conv.messages.push({ role:'tool', toolCallId:c.id, name:c.name, content: JSON.stringify(res), ok: res.ok, ts:Date.now() });
        }
        conv.updatedAt = Date.now();
        saveConvs();
        row.contentEl.innerHTML = '';
        continue;
      }
      finalMsg = { role:'assistant', content, reasoning: reasoning || undefined, ts:Date.now() };
      conv.messages.push(finalMsg);
      conv.updatedAt = Date.now();
      saveConvs();
      fillAssistantRow(row, finalMsg, true);
      break;
    }
    if (!finalMsg){
      const note = { role:'assistant', content:'（已达最大工具轮数，先停在这里。可以在设置里调小「最大工具轮数」，或者换个更直接的问法。）', ts:Date.now() };
      conv.messages.push(note);
      saveConvs();
      fillAssistantRow(row, note, true);
    }
  }catch(err){
    if (err && (err.name === 'AbortError' || String(err.message || '').includes('abort'))){
      if (content || reasoning){
        conv.messages.push({ role:'assistant', content, reasoning: reasoning || undefined, aborted:true, ts:Date.now() });
        fillAssistantRow(row, { content: content + '\n\n*（已手动停止）*', reasoning }, false);
      } else {
        row.contentEl.innerHTML = '<div class="error-card">已停止</div>';
      }
      saveConvs();
    } else {
      const msg = friendlyError(err);
      row.contentEl.innerHTML = '<div class="error-card">' + esc(msg) + '<br><button class="retry-btn" data-act="regen">重试</button></div>';
      conv.messages.push({ role:'assistant', content:'', error: msg, ts:Date.now() });
      saveConvs();
    }
  }
  sendState(false);
  renderSidebar(); renderTopbar(); updateBadges();
  autoScroll();
}
function regenerate(){
  const conv = currentConv();
  if (!conv || state.streaming) return;
  if (!conv.messages.some(m => m.role === 'user')) return;
  while (conv.messages.length && conv.messages[conv.messages.length - 1].role !== 'user') conv.messages.pop();
  saveConvs();
  renderChat();
  runAgent(conv);
}

async function copyText(text){
  try{ await navigator.clipboard.writeText(text); }
  catch{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); }catch{}
    ta.remove();
  }
}
function messagesClickHandler(e){
  const copyCode = e.target.closest('[data-copy-code]');
  if (copyCode){
    const ta = document.querySelector('[data-code-src="' + copyCode.dataset.copyCode + '"]');
    if (ta){
      copyText(ta.value);
      copyCode.innerHTML = iconSvg('check', 13) + '已复制';
      setTimeout(() => { copyCode.innerHTML = iconSvg('copy', 13) + '复制'; }, 1600);
    }
    return;
  }
  const act = e.target.closest('[data-act]');
  if (!act) return;
  const rowEl = act.closest('.msg-row');
  if (act.dataset.act === 'copy' && rowEl){
    const md = rowEl.querySelector('.md.content') || rowEl.querySelector('.md');
    copyText(md ? md.innerText : '');
    toast('已复制', 'ok');
  } else if (act.dataset.act === 'regen'){
    regenerate();
  }
}
function welcomeClickHandler(e){
  const card = e.target.closest('[data-wmode]');
  if (card){ setMode(card.dataset.wmode); return; }

}

  list.innerHTML = items.map(k =>
    '<div class="kb-item"><div class="kb-item-head"><b>' + esc(k.title) + '</b>' +
    '<span style="font-size:11px;color:var(--text3)">' + relTime(k.createdAt) + '</span>' +
    '<button data-del="' + k.id + '" title="删除">' + iconSvg('trash', 13) + '</button></div>' +
    '<p>' + esc(k.content.slice(0, 120)) + '</p></div>'
  ).join('');
}
function handleKbFiles(files){
  if (!files || !files.length) return;
  [...files].forEach(f => {
    if (f.type && !f.type.startsWith('text/') && !/\.(txt|md|markdown|text|json|csv)$/i.test(f.name)){
      toast('仅支持文本文件：' + f.name, 'err');
      return;
    }
    const reader = new FileReader();
    reader.onload = () => addKbItem(f.name.replace(/\.[^.]+$/, ''), String(reader.result || ''));
    reader.onerror = () => toast('读取失败：' + f.name, 'err');
    reader.readAsText(f);
  });
}

/* ================= 待办面板 ================= */
function renderTodos(){
  const list = $('#todo-list');
  if (!state.todos.length){ list.innerHTML = '<div class="todo-empty">暂无待办</div>'; return; }
  list.innerHTML = state.todos.map(t =>
    '<div class="todo-item' + (t.done ? ' done' : '') + '" data-id="' + t.id + '">' +
    '<span class="todo-check">' + (t.done ? iconSvg('check', 12) : '') + '</span>' +
    '<span class="todo-text">' + esc(t.title) + '</span>' +
    '<span class="todo-time">' + relTime(t.createdAt) + '</span>' +
    '<button data-del="' + t.id + '" title="删除">' + iconSvg('trash', 13) + '</button></div>'
  ).join('');
}
function addTodoFromInput(){
  const v = $('#todo-input').value.trim();
  if (!v) return;
  state.todos.push({ id: uid(), title: v, done: false, createdAt: Date.now() });
  $('#todo-input').value = '';
  syncTodo();
}

/* ================= 弹层 / 主题 / 提示 ================= */
function toast(msg, type){
  const t = document.createElement('div');
  t.className = 'toast' + (type ? ' ' + type : '');
  t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => {
    t.style.transition = 'opacity .3s';
    t.style.opacity = '0';
    setTimeout(() => t.remove(), 320);
  }, 2400);
}
function confirmDialog(text){
  return new Promise(resolve => {
    $('#confirm-text').textContent = text;
    const ov = $('#ov-confirm');
    ov.classList.remove('hidden');
    const yes = $('#confirm-yes'), no = $('#confirm-no');
    const done = v => { ov.classList.add('hidden'); yes.onclick = no.onclick = null; resolve(v); };
    yes.onclick = () => done(true);
    no.onclick = () => done(false);
  });
}
function openOv(sel){ $(sel).classList.remove('hidden'); }
function closeOv(sel){ $(sel).classList.add('hidden'); }
function applyTheme(){
  const pref = LS.get('theme', 'auto');
  const dark = pref === 'dark' || (pref === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  const ic = $('#theme-icon');
  if (ic) ic.innerHTML = iconSvg(dark ? 'sun' : 'moon', 18);
}
function closeSidebarMobile(){
  $('#sidebar').classList.remove('open');
  $('#side-backdrop').classList.remove('show');
}

/* ================= 启动 ================= */
function init(){
  initIcons();
  seedKB();
  if (state.activeId && !currentConv()) state.activeId = null;
  state.mode = currentConv() ? currentConv().mode : (LS.get('lastMode', 'chat'));
  if (!MODES[state.mode]) state.mode = 'chat';
  applyTheme();
  renderAll();
  renderKbList();
  renderTodos();

  $('#btn-new').addEventListener('click', createNewConv);
  $('#btn-send').addEventListener('click', () => sendMessage());
  $('#btn-stop').addEventListener('click', () => { if (state.abort) state.abort.abort(); });
  inputEl.addEventListener('input', autoGrow);
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); sendMessage(); }
  });

  $('#mode-bar').addEventListener('click', e => {
    const b = e.target.closest('[data-mode]');
    if (!b) return;
    if (state.streaming){ toast('等这轮说完'); return; }
    setMode(b.dataset.mode);
  });
  $('#model-badge').addEventListener('click', openSettings);
  $('#btn-settings').addEventListener('click', openSettings);
  $('#banner-btn').addEventListener('click', openSettings);
  $('#btn-theme').addEventListener('click', () => {
    const cur = document.documentElement.dataset.theme;
    LS.set('theme', cur === 'dark' ? 'light' : 'dark');
    applyTheme();
  });
  $('#btn-kb').addEventListener('click', () => { renderKbList(); openOv('#ov-kb'); });
  $('#btn-todo').addEventListener('click', () => { renderTodos(); openOv('#ov-todo'); });

  fillProviderSelect();
  $('#set-provider').addEventListener('change', onProviderChange);
  $('#set-temp').addEventListener('input', e => { $('#temp-val').textContent = e.target.value; });
  $('#btn-test').addEventListener('click', testConnectionBtn);
  $('#btn-save-settings').addEventListener('click', saveSettingsForm);
  $('#btn-clear-convs').addEventListener('click', async () => {
    if (await confirmDialog('清空全部会话？不可恢复。')){
      state.convs = [];
      state.activeId = null;
      saveConvs();
      renderAll();
      closeOv('#ov-settings');
      toast('已清空');
    }
  });

  $$('.overlay').forEach(ov => {
    ov.addEventListener('click', e => { if (e.target === ov && ov.id !== 'ov-confirm') ov.classList.add('hidden'); });
    ov.querySelectorAll('.ov-close').forEach(b => b.addEventListener('click', () => ov.classList.add('hidden')));
  });

  $('#btn-kb-add').addEventListener('click', () => {
    if (addKbItem($('#kb-title').value, $('#kb-text').value)){
      $('#kb-text').value = '';
      $('#kb-title').value = '';
      toast('已添加', 'ok');
    }
  });
  $('#kb-list').addEventListener('click', e => {
    const b = e.target.closest('[data-del]');
    if (!b) return;
    state.kb = state.kb.filter(k => k.id !== b.dataset.del);
    saveKB(); renderKbList(); updateBadges();
  });
  $('#kb-search').addEventListener('input', renderKbList);
  $('#btn-kb-file').addEventListener('click', () => $('#kb-file').click());
  $('#kb-file').addEventListener('change', e => { handleKbFiles(e.target.files); e.target.value = ''; });
  const zone = $('#kb-add-zone');
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
  zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('dragover'); handleKbFiles(e.dataTransfer.files); });

  $('#btn-todo-add').addEventListener('click', addTodoFromInput);
  $('#todo-input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing){ e.preventDefault(); addTodoFromInput(); } });
  $('#todo-list').addEventListener('click', e => {
    const item = e.target.closest('.todo-item');
    if (!item) return;
    if (e.target.closest('[data-del]')){
      state.todos = state.todos.filter(t => t.id !== item.dataset.id);
      syncTodo();
      return;
    }
    if (e.target.closest('.todo-check')){
      const t = state.todos.find(x => x.id === item.dataset.id);
      if (t){ t.done = !t.done; syncTodo(); }
    }
  });

  $('#messages').addEventListener('click', messagesClickHandler);
  $('#welcome').addEventListener('click', welcomeClickHandler);

  $('#conv-list').addEventListener('click', e => {
    const act = e.target.closest('[data-act]');
    const item = e.target.closest('.conv-item');
    if (act && item){
      const id = item.dataset.id;
      if (act.dataset.act === 'rename') startTitleEdit(item, id);
      else if (act.dataset.act === 'export') exportConv(id);
      else if (act.dataset.act === 'del') deleteConv(id);
      return;
    }
    if (item) switchConv(item.dataset.id);
  });

  $('#btn-menu').addEventListener('click', () => {
    $('#sidebar').classList.add('open');
    $('#side-backdrop').classList.add('show');
  });
  $('#btn-side-close').addEventListener('click', closeSidebarMobile);
  $('#side-backdrop').addEventListener('click', closeSidebarMobile);

  if (window.matchMedia){
    const mq = matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', () => { if (LS.get('theme', 'auto') === 'auto') applyTheme(); });
  }

  inputEl.focus();
}
init();
</script>
</body>
</html>
